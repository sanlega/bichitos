name: iOS build check

on:
  push:
    branches: [master]
    paths: ['ios/**', '.github/workflows/ios-build-check.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          sims = [x for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pick = next((x for n in ('iPhone 17 Pro Max', 'iPhone 16 Pro Max') for x in sims if x['name'] == n), sims[0])
          print(pick['name'], file=sys.stderr)
          print(pick['udid'])
          ")
          echo "SIM=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        # TEST_RUNNER_GALLERY_DIR reaches the tests as GALLERY_DIR: the generator gallery test writes its PNGs there, the voice test its WAV.
        run: |
          set +e
          mkdir -p gallery
          TEST_RUNNER_GALLERY_DIR="$PWD/gallery" xcodebuild -project Bichitos.xcodeproj -scheme Bichitos -destination "id=$SIM" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*Bichitos|Test Case .* (passed|failed)|XCTAssert|\*\* (TEST|BUILD)" build.log | sort -u | head -300
          exit $status

      - name: Screenshot of the world
        # The app launched with -screenshot starts a fixed, staged world; capture it after a few seconds of life.
        run: |
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryLevel 100 --batteryState charged || true
          xcrun simctl install "$SIM" build/Build/Products/Debug-iphonesimulator/Bichitos.app
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot
          sleep 6
          mkdir -p screenshots
          xcrun simctl io "$SIM" screenshot screenshots/world.png
          # Second shot: the edge between two districts, with the "moving out" line still on screen.
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -border -screenshot-toast
          sleep 4
          xcrun simctl io "$SIM" screenshot screenshots/border.png
          # -screenshot-away fast-forwards a fixed world 3 h and shows the "mientras no estabas" sheet.
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot-away
          sleep 8
          xcrun simctl io "$SIM" screenshot screenshots/away.png
          xcrun simctl spawn "$SIM" log show --last 2m --style compact --predicate 'subsystem == "com.santilega.bichitos"' || true
          # Same world, but every bubble is a phrase from the voice (#14); phrases show from Calle (#32).
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-talk -screenshot-zoom 5
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/talk.png
          # Same world at other zoom levels (#30): Calle (5 pt per u) and Mapa (0.28 pt per u).
          for zoom in 5:street 0.28:map; do
            xcrun simctl terminate "$SIM" com.santilega.bichitos || true
            xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-zoom "${zoom%%:*}"
            sleep 6
            xcrun simctl io "$SIM" screenshot "screenshots/zoom-${zoom##*:}.png"
          done

      - name: Screenshot of a toast
        # -screenshot-toast records an egg and a birth in the staged world and keeps the toast up (#49).
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-toast
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/toast.png

      - name: Screenshot of the editor
        # -screenshot-editor opens the editor sheet over the same staged world.
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-editor
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/editor.png

      - name: Screenshot of food mode
        # -screenshot-food turns food mode on: FoodPicker, accent edge and hint over the staged world.
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-food
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/food.png

      - name: Screenshot of a bichito's card
        # -screenshot-card opens the card of a staged bichito with friends, rivals and family.
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-card
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/card.png

      - name: Screenshot of a bichito's peek
        # -screenshot-peek opens BichitoPeek (a tap on a bichito) over the tray.
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-peek
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/peek.png

      - name: Screenshot of the district picker
        # -screenshot-barrios opens BarrioPicker over the two-district world (-border): 2 open, 5 locked.
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -border -screenshot-barrios
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/barrios.png

      - name: Screenshot of the news feed
        # -screenshot-news fills the staged world's news with stories of different ages and opens NewsFeed (#51).
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-news
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/news.png

      - name: Screenshot of the settings sheet
        # -screenshot-settings opens the gearshape's sheet: «Voz» and «Vibración» (#15).
        run: |
          xcrun simctl terminate "$SIM" com.santilega.bichitos || true
          xcrun simctl launch "$SIM" com.santilega.bichitos -screenshot -screenshot-settings
          sleep 6
          xcrun simctl io "$SIM" screenshot screenshots/settings.png

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log

      - name: Upload generator gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: ios/gallery
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore
